<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Yuimellkub Top-up</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff6fa}iframe{border:0;width:100%;height:100%;display:block;background:#fff6fa}</style>
</head>
<body>
<iframe id="site" src="index.html.html" title="Yuimellkub Top-up"></iframe>
<script>
document.getElementById('site').addEventListener('load',function(){
  const w=this.contentWindow,d=this.contentDocument;if(!d)return;
  const mobileFix=d.createElement('style');mobileFix.textContent='.done-actions .order-btn{grid-column:1/-1!important;width:100%!important}';d.head.appendChild(mobileFix);
  const s=d.createElement('script');s.textContent=`(function(){function applyStockStates(items){document.querySelectorAll('.ready-stock-order-btn').forEach(btn=>{const p=items.find(x=>String(x.name||'สินค้า')===String(btn.dataset.readyName||'')&&String(Number(x.price||0))===String(Number(btn.dataset.readyPrice||'0'))&&String(x.category||'echoes')===String(btn.dataset.readyCategory||'echoes'));if(!p)return;const status=p.status||'ready',label=status==='out'?'หมดชั่วคราว':status==='paused'?'ปิดชั่วคราว':'พร้อมเติม',disabled=status==='out'||status==='paused',card=btn.closest('.ready-stock-card'),badge=card&&card.querySelector('.ready-stock-status');btn.disabled=disabled;btn.textContent=disabled?label:'สั่งซื้อ';if(card)card.classList.toggle('is-soldout',disabled);if(badge){badge.textContent=label;badge.classList.toggle('is-ready',!disabled);badge.classList.toggle('is-out',disabled);}})}function start(){try{if(!window.firebase||!firebase.firestore)return setTimeout(start,250);if(!firebase.apps.length){if(!window.YUIMELLKUB_FIREBASE_CONFIG)return;firebase.initializeApp(window.YUIMELLKUB_FIREBASE_CONFIG)}firebase.firestore().collection('products').onSnapshot(snap=>{if(snap.empty)return;setTimeout(()=>applyStockStates(snap.docs.map(d=>({id:d.id,...d.data()}))),0)})}catch(e){console.warn('stock state patch failed',e)}}start()})();`;d.body.appendChild(s);
  const orderLabel=d.createElement('script');orderLabel.textContent=`(function(){function fix(){document.querySelectorAll('button,a').forEach(el=>{if(/สั่งเติมผ่าน\\s*Messenger/i.test(el.textContent||''))el.textContent='🎀 สั่งเติมเลย';});}fix();new MutationObserver(fix).observe(document.body,{childList:true,subtree:true});})();`;d.body.appendChild(orderLabel);
  const pendingClean=d.createElement('script');pendingClean.textContent=`(function(){function clean(){const card=document.getElementById('ymkForceCard');if(!card)return;const all=card.innerText||'';if(!/ส่งสลิปเรียบร้อยแล้ว|รอร้านตรวจสอบ|ยังไม่มีเลขออเดอร์|ร้านได้รับสลิปในระบบแล้ว/.test(all))return;card.querySelectorAll('button,a').forEach(el=>{const t=(el.textContent||'').trim();if(/^(Messenger|LINE)$/i.test(t))el.style.setProperty('display','none','important');});card.querySelectorAll('div,p,span,strong,b,small').forEach(el=>{if(el.children.length)return;const t=(el.textContent||'').trim();if(/^เลขอ้างอิงสลิป$/.test(t)||/^เลขออเดอร์:\s*(?:SLIP|YMK)[A-Z0-9-]+(?:\s*•.*)?$/.test(t))el.style.setProperty('display','none','important');});}clean();new MutationObserver(clean).observe(document.body,{childList:true,subtree:true,characterData:true});})();`;d.body.appendChild(pendingClean);
  function idsIn(scope){return [...String((scope||d.body).innerText||'').matchAll(/YMK\d{6}-\d{6}/g)].map(x=>x[0]);}
  function findOrderId(scope){const scoped=idsIn(scope);if(scoped.length)return scoped[scoped.length-1];const visible=[...d.querySelectorAll('#adminSaveStatus,#ymkApprovedOrderId,#ymkForceCard')].flatMap(el=>idsIn(el));if(visible.length)return visible[visible.length-1];let id='';try{id=String(w.currentOrderId||'').trim()}catch(_){}return /^YMK\d{6}-\d{6}$/.test(id)?id:'';}
  async function writeOrderId(id){if(!/^YMK\d{6}-\d{6}$/.test(id))return false;try{await w.navigator.clipboard.writeText(id);return true;}catch(_){try{const ta=d.createElement('textarea');ta.value=id;ta.setAttribute('readonly','');ta.style.position='fixed';ta.style.left='-9999px';d.body.appendChild(ta);ta.select();d.execCommand('copy');ta.remove();return true;}catch(__){return false;}}}
  async function copyOrderIdOnly(scope){return writeOrderId(findOrderId(scope));}
  w.ymkCopyOrderIdOnly=copyOrderIdOnly;
  d.addEventListener('click',async function(e){const btn=e.target.closest('#ymkApprovedOrderId');if(!btn)return;e.preventDefault();e.stopPropagation();e.stopImmediatePropagation();const scope=btn.closest('#ymkForceCard')||d.body;const id=findOrderId(scope);if(!(await writeOrderId(id)))return;const old=btn.textContent;btn.textContent='คัดลอกแล้ว ✓';setTimeout(()=>{btn.textContent=old},900);},true);
  d.addEventListener('click',async function(e){const el=e.target.closest('button,a');if(!el)return;const text=(el.textContent||'').trim();if(/คัดลอก/.test(text)&&(/ออเดอร์/.test(text)||/YMK\d{6}-\d{6}/.test(text))){e.preventDefault();e.stopPropagation();e.stopImmediatePropagation();const scope=el.closest('#ymkForceCard,.done-card,.order-done,.modal-content,.modal-card')||d.body;const id=findOrderId(scope);if(!(await writeOrderId(id)))return;const old=el.textContent;el.textContent='คัดลอกแล้ว ✓';setTimeout(()=>{el.textContent=old},900);}},true);

  const statusCardFix=d.createElement('script');statusCardFix.textContent=`(function(){
    function rootPanel(card,node){let x=node;while(x&&x.parentElement&&x.parentElement!==card)x=x.parentElement;return x||node;}
    function findOld(card,re){const nodes=[...card.querySelectorAll('div,p,span,strong,b,h1,h2,h3,h4')].filter(x=>x.id!=='ymkStatusCardV2'&&re.test((x.textContent||'').trim()));return nodes.sort((a,b)=>(a.textContent||'').length-(b.textContent||'').length)[0]||null;}
    function hideOld(card,re){const n=findOld(card,re);if(!n)return;const p=rootPanel(card,n);if(p&&p.id!=='ymkStatusCardV2')p.style.setProperty('display','none','important');}
    function ensureCard(card){let box=card.querySelector('#ymkStatusCardV2');if(!box){box=document.createElement('div');box.id='ymkStatusCardV2';box.style.cssText='display:block!important;margin:14px 0 0!important;padding:20px 16px!important;border:1px solid #efc6d7!important;border-radius:16px!important;background:#fffafd!important;color:#8f4f68!important;text-align:center!important;height:auto!important;min-height:0!important;max-height:none!important;overflow:visible!important;box-sizing:border-box!important';card.appendChild(box);}return box;}
    function renderPending(card){hideOld(card,/ส่งสลิปเรียบร้อยแล้ว.*รอร้านตรวจสอบ/);const box=ensureCard(card);if(box.dataset.mode==='pending')return;box.dataset.mode='pending';box.innerHTML='<div style="font-size:19px;font-weight:900;line-height:1.45">✓ ส่งสลิปเรียบร้อยแล้ว • รอร้านตรวจสอบ ♡</div><div style="margin-top:10px;font-size:13px;font-weight:700;line-height:1.7;color:#9a687c">ร้านได้รับสลิปในระบบแล้ว ไม่ต้องส่งซ้ำค่ะ<br>หลังร้านยืนยันสลิป ระบบจะแสดงเลขออเดอร์ตรงนี้</div>';}
    function renderApproved(card,id){hideOld(card,/ส่งออเดอร์เรียบร้อยแล้ว/);const box=ensureCard(card);if(box.dataset.mode==='approved'&&box.dataset.orderId===id)return;box.dataset.mode='approved';box.dataset.orderId=id;box.innerHTML='<div style="font-size:20px;font-weight:900;line-height:1.45">✓ ส่งออเดอร์เรียบร้อยแล้ว ♡</div><div style="margin-top:10px;font-size:15px;font-weight:900">เลขออเดอร์ของคุณ</div><div style="margin-top:5px;font-size:13px;font-weight:700;line-height:1.7;color:#9a526d">เลขออเดอร์: <strong>'+id+'</strong> • เก็บเลขนี้ไว้สำหรับติดตามสถานะ<br>กรุณาบันทึกเลขออเดอร์นี้ไว้สำหรับติดตามสถานะ<br>กรุณารอเติมสักครู่นะคะ</div><button type="button" id="ymkApprovedOrderId" style="display:inline-block!important;margin-top:12px!important;border:1px solid #efbfd1!important;background:#fff3f8!important;padding:10px 17px!important;border-radius:12px!important;color:#9a526d!important;font:inherit!important;font-size:13px!important;font-weight:900!important;cursor:pointer!important">คัดลอกเลขออเดอร์</button>';}
    function run(){const card=document.getElementById('ymkForceCard'),st=document.getElementById('adminSaveStatus');if(!card||!st)return;const text=(st.textContent||'').trim();const m=text.match(/YMK\\d{6}-\\d{6}/);if(m&&/ส่งออเดอร์เข้าระบบแล้ว|ร้านยืนยันสลิปแล้ว|เลขออเดอร์/.test(text)){renderApproved(card,m[0]);return;}if(/กำลังรอร้านตรวจสอบสลิป|ยังไม่มีการสร้างออเดอร์|ส่งสลิปแล้ว.*รอร้านตรวจสอบ/.test(text)){renderPending(card);}}
    setInterval(run,150);new MutationObserver(run).observe(document.body,{childList:true,subtree:true,characterData:true});run();
  })();`;d.body.appendChild(statusCardFix);

  const calcRules=d.createElement('script');calcRules.src='calculator-pack-rules.js?v=6';d.body.appendChild(calcRules);
  const discountFix=d.createElement('script');discountFix.src='discount-price-fix.js?v=1';d.body.appendChild(discountFix);
  const store=d.createElement('script');store.src='storefront-category-sync.js?v=3';d.body.appendChild(store);
  const widthFix=d.createElement('script');widthFix.src='ready-stock-card-width-fix.js?v=4';d.body.appendChild(widthFix);
  const quantity=d.createElement('script');quantity.src='ready-stock-quantity.js?v=8';d.body.appendChild(quantity);
  const pack=d.createElement('script');pack.src='order-button-pack-patch.js?v=5';d.body.appendChild(pack);
  const forcePack=d.createElement('script');forcePack.src='order-pack-modal-fix.js?v=9';d.body.appendChild(forcePack);
  const slipStore=d.createElement('script');slipStore.src='order-slip-firestore.js?v=5';slipStore.onload=()=>{const manualFlow=d.createElement('script');manualFlow.src='order-slip-manual-flow-fix.js?v=21';d.body.appendChild(manualFlow)};d.body.appendChild(slipStore);
  const fulfillment=d.createElement('script');fulfillment.src='order-fulfillment-slip.js?v=4';d.body.appendChild(fulfillment);
  const slipReview=d.createElement('script');slipReview.src='order-slip-review-status.js?v=1';d.body.appendChild(slipReview);
  const cfg=d.createElement('script');cfg.src='emailjs-config.js?v=1';cfg.onload=()=>{const mail=d.createElement('script');mail.src='order-email-notify.js?v=4';d.body.appendChild(mail)};d.body.appendChild(cfg);
});
</script>
</body>
</html>
