<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Yuimellkub Top-up</title>
<style>html,body{margin:0;width:100%;height:100%;overflow-x:hidden;overflow-y:auto;background:#fff6fa;overscroll-behavior-x:none;touch-action:pan-y}iframe{border:0;width:100%;height:100%;display:block;background:#fff6fa;max-width:100vw}</style>
</head>
<body>
<iframe id="site" src="index.html.html" title="Yuimellkub Top-up"></iframe>
<script>
document.getElementById('site').addEventListener('load',function(){
  const w=this.contentWindow,d=this.contentDocument;if(!d)return;
  const mobileFix=d.createElement('style');mobileFix.textContent='html,body{background:#fff6fa!important;overscroll-behavior-y:auto!important;overscroll-behavior-x:none!important;overflow-x:hidden!important;overflow-y:auto!important;width:100%!important;max-width:100%!important;touch-action:pan-y!important}body{min-height:100%!important}.done-actions .order-btn{grid-column:1/-1!important;width:100%!important}.ymk-white-cart{display:inline-block;width:22px;height:22px;vertical-align:-5px;margin-right:8px;color:#fff}.ymk-white-cart svg{display:block;width:100%;height:100%;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}@media(max-width:699px){.ready-stock-card .ymk-qty-wrap{position:static!important;left:auto!important;right:auto!important;transform:none!important;overflow:visible!important}.ready-stock-card .ymk-qty-wrap>div:first-child{position:static!important;left:auto!important;right:auto!important;transform:none!important;width:100%!important;max-width:100%!important;margin:0 auto!important;padding:0!important;display:flex!important;align-items:center!important;justify-content:center!important;gap:8px!important;box-sizing:border-box!important}.ready-stock-card .ymk-qty-wrap>div:first-child>span{position:static!important;left:auto!important;right:auto!important;transform:none!important;display:inline-block!important;flex:0 0 auto!important;width:auto!important;min-width:max-content!important;margin:0!important;padding:0!important;white-space:nowrap!important}.ready-stock-card .ymk-confirm-order{margin-left:auto!important;margin-right:auto!important}}';d.head.appendChild(mobileFix);
  const s=d.createElement('script');s.textContent=`(function(){function applyStockStates(items){document.querySelectorAll('.ready-stock-order-btn').forEach(btn=>{const p=items.find(x=>String(x.name||'สินค้า')===String(btn.dataset.readyName||'')&&String(Number(x.price||0))===String(Number(btn.dataset.readyPrice||'0'))&&String(x.category||'echoes')===String(btn.dataset.readyCategory||'echoes'));if(!p)return;const status=p.status||'ready',label=status==='out'?'หมดชั่วคราว':status==='paused'?'ปิดชั่วคราว':'พร้อมเติม',disabled=status==='out'||status==='paused',card=btn.closest('.ready-stock-card'),badge=card&&card.querySelector('.ready-stock-status');btn.disabled=disabled;btn.textContent=disabled?label:'สั่งซื้อ';if(card)card.classList.toggle('is-soldout',disabled);if(badge){badge.textContent=label;badge.classList.toggle('is-ready',!disabled);badge.classList.toggle('is-out',disabled);}})}function start(){try{if(!window.firebase||!firebase.firestore)return setTimeout(start,250);if(!firebase.apps.length){if(!window.YUIMELLKUB_FIREBASE_CONFIG)return;firebase.initializeApp(window.YUIMELLKUB_FIREBASE_CONFIG)}firebase.firestore().collection('products').onSnapshot(snap=>{if(snap.empty)return;setTimeout(()=>applyStockStates(snap.docs.map(d=>({id:d.id,...d.data()}))),0)})}catch(e){console.warn('stock state patch failed',e)}}start()})();`;d.body.appendChild(s);
  const orderLabel=d.createElement('script');orderLabel.textContent=`(function(){const icon='<span class="ymk-white-cart" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="9" cy="20" r="1"></circle><circle cx="19" cy="20" r="1"></circle><path d="M3 4h2l2.4 10.2a2 2 0 0 0 2 1.6h7.8a2 2 0 0 0 2-1.6L21 8H6"></path></svg></span>';function fix(){document.querySelectorAll('button,a').forEach(el=>{const t=(el.textContent||'').trim();if(/สั่งเติมผ่าน\\s*Messenger/i.test(t)||/^(?:🛒|🛍️|🛍|🛒️)?\\s*สั่งเติมเลย$/.test(t)){if(!el.querySelector('.ymk-white-cart'))el.innerHTML=icon+'<span>สั่งเติมเลย</span>';}});}fix();new MutationObserver(fix).observe(document.body,{childList:true,subtree:true});})();`;d.body.appendChild(orderLabel);
  function idsIn(scope){return [...String((scope||d.body).innerText||'').matchAll(/YMK\d{6}-\d{6}/g)].map(x=>x[0]);}
  function findOrderId(scope){const scoped=idsIn(scope);if(scoped.length)return scoped[scoped.length-1];const visible=[...d.querySelectorAll('#adminSaveStatus,#ymkApprovedOrderId,#ymkForceCard')].flatMap(el=>idsIn(el));if(visible.length)return visible[visible.length-1];let id='';try{id=String(w.currentOrderId||'').trim()}catch(_){}return /^YMK\d{6}-\d{6}$/.test(id)?id:'';}
  async function writeOrderId(id){if(!/^YMK\d{6}-\d{6}$/.test(id))return false;try{await w.navigator.clipboard.writeText(id);return true;}catch(_){try{const ta=d.createElement('textarea');ta.value=id;ta.setAttribute('readonly','');ta.style.position='fixed';ta.style.left='-9999px';d.body.appendChild(ta);ta.select();d.execCommand('copy');ta.remove();return true;}catch(__){return false;}}}
  w.ymkCopyOrderIdOnly=async function(scope){return writeOrderId(findOrderId(scope));};
  d.addEventListener('click',async function(e){const el=e.target.closest('button,a');if(!el)return;const text=(el.textContent||'').trim();if(!(/คัดลอก/.test(text)&&(/ออเดอร์/.test(text)||/YMK\d{6}-\d{6}/.test(text))))return;e.preventDefault();e.stopPropagation();e.stopImmediatePropagation();const scope=el.closest('#ymkFinalOrderStatusCard,#ymkForceCard,.done-card,.order-done,.modal-content,.modal-card')||d.body;const id=findOrderId(scope);if(!(await writeOrderId(id)))return;const old=el.textContent;el.textContent='คัดลอกแล้ว ✓';setTimeout(()=>{el.textContent=old},900);},true);
  const calcRules=d.createElement('script');calcRules.src='calculator-pack-rules.js?v=7';d.body.appendChild(calcRules);
  const discountFix=d.createElement('script');discountFix.src='discount-price-fix.js?v=1';d.body.appendChild(discountFix);
  const store=d.createElement('script');store.src='storefront-category-sync.js?v=6';d.body.appendChild(store);
  const widthFix=d.createElement('script');widthFix.src='ready-stock-card-width-fix.js?v=5';d.body.appendChild(widthFix);
  const sendOption=d.createElement('script');sendOption.src='send-order-option.js?v=18';d.body.appendChild(sendOption);
  const sendAfter=d.createElement('script');sendAfter.src='send-after-payment-message.js?v=4';d.body.appendChild(sendAfter);
  const normalSkinPrice=d.createElement('script');normalSkinPrice.src='normal-skin-order-price-format.js?v=2';d.body.appendChild(normalSkinPrice);
  const quantity=d.createElement('script');quantity.src='ready-stock-quantity.js?v=15';d.body.appendChild(quantity);
  const pack=d.createElement('script');pack.src='order-button-pack-patch.js?v=7';d.body.appendChild(pack);
  const forcePack=d.createElement('script');forcePack.src='order-pack-modal-fix.js?v=21';d.body.appendChild(forcePack);
  const cart=d.createElement('script');cart.src='cart-multi-order.js?v=11';d.body.appendChild(cart);
  const paymentFormat=d.createElement('script');paymentFormat.src='payment-display-format.js?v=1';d.body.appendChild(paymentFormat);
  const hours=d.createElement('script');hours.src='store-hours-notice.js?v=1';d.body.appendChild(hours);
  const contactText=d.createElement('script');contactText.src='contact-bar-text-fix.js?v=1';d.body.appendChild(contactText);
  const slipStore=d.createElement('script');slipStore.src='order-slip-firestore.js?v=8';slipStore.onload=()=>{const manualFlow=d.createElement('script');manualFlow.src='order-slip-manual-flow-fix.js?v=25';manualFlow.onload=()=>{const statusUi=d.createElement('script');statusUi.src='order-status-ui-fix.js?v=5';d.body.appendChild(statusUi)};d.body.appendChild(manualFlow)};d.body.appendChild(slipStore);
  const fulfillment=d.createElement('script');fulfillment.src='order-fulfillment-slip.js?v=6';d.body.appendChild(fulfillment);
  const slipReview=d.createElement('script');slipReview.src='order-slip-review-status.js?v=1';d.body.appendChild(slipReview);
  const cfg=d.createElement('script');cfg.src='emailjs-config.js?v=1';cfg.onload=()=>{const mail=d.createElement('script');mail.src='order-email-notify.js?v=5';d.body.appendChild(mail)};d.body.appendChild(cfg);
});
</script>
</body>
</html>
