document.getElementById('site').addEventListener('load',function(){
 const w=this.contentWindow,d=this.contentDocument;if(!d)return;
 function load(src,next){const s=d.createElement('script');s.src=src;s.onload=next||null;s.onerror=()=>console.error('YMK load failed',src);d.head.appendChild(s)}
 load('https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js',()=>load('https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js',()=>load('https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js',()=>load('firebase-config.js?v=11',()=>{
   if(!w.firebase||!w.firebase.firestore)return;
   const a=d.createElement('script');a.src='production-main-bridge.js?v=11';d.body.appendChild(a);
   const b=d.createElement('script');b.src='main-v65-production-products.js?v=15';d.body.appendChild(b);
   const c=d.createElement('script');c.src='member-production-bridge.js?v=5';d.body.appendChild(c);
 }))));
 ['calculator-pack-rules.js?v=7','discount-price-fix.js?v=1','ready-stock-card-width-fix.js?v=5','payment-display-format.js?v=2','store-hours-notice.js?v=1','contact-bar-text-fix.js?v=1'].forEach(src=>{const s=d.createElement('script');s.src=src;d.body.appendChild(s)});
 const slip=d.createElement('script');slip.src='order-slip-firestore.js?v=8';slip.onload=()=>{const m=d.createElement('script');m.src='order-slip-manual-flow-fix.js?v=36';d.body.appendChild(m)};d.body.appendChild(slip);
 ['order-fulfillment-slip.js?v=6','order-slip-review-status.js?v=1'].forEach(src=>{const s=d.createElement('script');s.src=src;d.body.appendChild(s)});
 const cfg=d.createElement('script');cfg.src='emailjs-config.js?v=1';cfg.onload=()=>{const m=d.createElement('script');m.src='order-email-notify.js?v=6';d.body.appendChild(m)};d.body.appendChild(cfg);
 const v20=d.createElement('script');v20.src='production-v20-final.js?v=1';d.body.appendChild(v20);
});
</script>
