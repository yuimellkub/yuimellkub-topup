<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ติดตามออเดอร์ | Yuimellkub</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#fff6fa;color:#6f4658}.wrap{max-width:560px;margin:auto;padding:38px 18px}.title{text-align:center;font-size:25px;font-weight:900;color:#8f4f68}.sub{text-align:center;color:#a16b80;font-size:13px;margin:6px 0 22px}.card{background:#fff;border:1px solid #f2ccdc;border-radius:20px;padding:18px;box-shadow:0 8px 24px rgba(190,105,145,.08)}label{display:block;font-size:12px;font-weight:800;color:#8f5d71;margin-bottom:7px}input{width:100%;height:48px;border:1px solid #efc8d7;border-radius:13px;padding:0 14px;font:inherit;color:#71465a;outline:none;text-transform:uppercase}button{width:100%;margin-top:11px;height:48px;border:0;border-radius:13px;background:#e889ad;color:#fff;font-weight:900;font-size:15px;cursor:pointer}.result{display:none;margin-top:16px;padding:18px;border-radius:16px;background:#fff0f6;border:1px solid #f2c6d7;text-align:center}.oid{font-size:12px;color:#a16b80}.status{font-size:21px;font-weight:900;color:#8f4f68;margin-top:8px}.note{font-size:12px;color:#a16b80;margin-top:8px;line-height:1.6}.error{color:#a65367}.footer{text-align:center;margin-top:18px;font-size:11px;color:#b38a99}</style></head><body><div class="wrap"><div class="title">♡ ติดตามออเดอร์</div><div class="sub">Yuimellkub Top-up</div><div class="card"><label>เลขออเดอร์</label><input id="orderId" placeholder="เช่น YMK260910-183536" autocomplete="off"><button id="check">ตรวจสอบสถานะ</button><div id="result" class="result"></div></div><div class="footer">กรอกเลขออเดอร์ที่ได้รับหลังส่งคำสั่งซื้อ ♡</div></div><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script><script src="firebase-config.js"></script><script>const result=document.getElementById('result'),input=document.getElementById('orderId');if(window.YUIMELLKUB_FIREBASE_CONFIG){if(!firebase.apps.length)firebase.initializeApp(window.YUIMELLKUB_FIREBASE_CONFIG);var db=firebase.firestore()}function esc(v=''){return String(v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}async function check(){const id=input.value.trim().toUpperCase();result.style.display='block';if(!id){result.innerHTML='<div class="error">กรุณากรอกเลขออเดอร์</div>';return}if(!window.db){result.innerHTML='<div class="error">เชื่อมระบบไม่ได้ กรุณาลองใหม่</div>';return}result.innerHTML='กำลังตรวจสอบ...';try{const d=await db.collection('order_status').doc(id).get();if(!d.exists){result.innerHTML='<div class="error">ไม่พบเลขออเดอร์นี้</div><div class="note">ตรวจสอบตัวอักษรและตัวเลขแล้วลองอีกครั้ง</div>';return}const s=d.data().status||'รอตรวจสอบการชำระเงิน';result.innerHTML='<div class="oid">'+esc(id)+'</div><div class="status">'+esc(s)+'</div><div class="note">สถานะนี้อัปเดตจากหลังบ้านของร้าน</div>'}catch(e){result.innerHTML='<div class="error">ยังตรวจสอบไม่ได้</div><div class="note">'+esc(e.message)+'</div>'}}document.getElementById('check').onclick=check;input.addEventListener('keydown',e=>{if(e.key==='Enter')check()});</script></body></html>
