<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ติดตามออเดอร์ | Yuimellkub</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#fff6fa;color:#6f4658}.wrap{max-width:560px;margin:auto;padding:38px 18px}.title{text-align:center;font-size:25px;font-weight:900;color:#8f4f68}.sub{text-align:center;color:#a16b80;font-size:13px;margin:6px 0 22px}.card{background:#fff;border:1px solid #f2ccdc;border-radius:20px;padding:18px;box-shadow:0 8px 24px rgba(190,105,145,.08)}label{display:block;font-size:12px;font-weight:800;color:#8f5d71;margin-bottom:7px}input{width:100%;height:48px;border:1px solid #efc8d7;border-radius:13px;padding:0 14px;font:inherit;color:#71465a;outline:none;text-transform:uppercase}button{width:100%;margin-top:11px;height:48px;border:0;border-radius:13px;background:#e889ad;color:#fff;font-weight:900;font-size:15px;cursor:pointer}.result{display:none;margin-top:16px;padding:18px;border-radius:16px;background:#fff0f6;border:1px solid #f2c6d7;text-align:center}.oid{font-size:12px;color:#a16b80}.status{font-size:21px;font-weight:900;color:#8f4f68;margin-top:8px}.note{font-size:12px;color:#a16b80;margin-top:8px;line-height:1.6}.error{color:#a65367}.footer{text-align:center;margin-top:18px;font-size:11px;color:#b38a99}</style></head><body><div class="wrap"><div class="title">♡ ติดตามออเดอร์</div><div class="sub">Yuimellkub Top-up</div><div class="card"><label>เลขออเดอร์</label><input id="orderId" placeholder="เช่น YMK260910-183536" autocomplete="off"><button id="check">ตรวจสอบสถานะ</button><div id="result" class="result"></div></div><div class="footer">ลิงก์นี้ใช้ติดตามสถานะรายการของคุณ ♡</div></div><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script><script src="firebase-config.js"></script><script>
const result=document.getElementById('result'),input=document.getElementById('orderId');
if(window.YUIMELLKUB_FIREBASE_CONFIG){if(!firebase.apps.length)firebase.initializeApp(window.YUIMELLKUB_FIREBASE_CONFIG);var db=firebase.firestore()}
function esc(v=''){return String(v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
let unsub=null;
function showError(t,n=''){result.style.display='block';result.innerHTML='<div class="error">'+esc(t)+'</div>'+(n?'<div class="note">'+esc(n)+'</div>':'')}
async function watch(id){
  id=String(id||'').trim().toUpperCase(); result.style.display='block';
  if(!id){showError('ไม่พบลิงก์ติดตามรายการ');return}
  if(!window.db){showError('เชื่อมระบบไม่ได้ กรุณาลองใหม่');return}
  input.value=id; result.innerHTML='กำลังตรวจสอบ...';
  if(unsub){try{unsub()}catch(e){} unsub=null}
  const ref=db.collection('order_status').doc(id);
  const render=s=>{
    if(!s.exists){showError('ยังไม่พบรายการนี้','กรุณารอสักครู่แล้วลองใหม่');return}
    const d=s.data()||{}, order=String(d.orderId||d.order_id||d.approvedOrderId||d.approved_order_id||'').trim();
    const status=String(d.status||'กำลังรอร้านตรวจสอบสลิป');
    const label=/^SLIP/i.test(id)?'เลขติดตามรายการ':'เลขออเดอร์';
    result.innerHTML='<div class="oid">'+label+'<br>'+esc(id)+'</div><div class="status">'+esc(status)+'</div>'+(order?'<div class="note">เลขออเดอร์: <b>'+esc(order)+'</b></div>':'<div class="note">ร้านได้รับสลิปแล้ว สามารถเปิดลิงก์นี้กลับมาเช็กได้ตลอดค่ะ ♡</div>');
  };
  try{const snap=await ref.get();render(snap);unsub=ref.onSnapshot(render,()=>{});}catch(e){showError('ยังตรวจสอบไม่ได้',e.message||'')}
}
async function check(){watch(input.value)}
document.getElementById('check').onclick=check;input.addEventListener('keydown',e=>{if(e.key==='Enter')check()});
const q=(new URL(location.href).searchParams.get('track')||'').trim();
if(q){document.querySelector('label').textContent='เลขติดตามรายการ';document.getElementById('check').style.display='none';watch(q);}
</script></body></html>
