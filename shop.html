<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Yuimellkub Top-up | สินค้าพร้อมเติม</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#fff6fa;color:#6f4658}.wrap{max-width:900px;margin:auto;padding:24px 16px 60px}.head{text-align:center;margin-bottom:18px}.head h1{margin:0;color:#8f4f68}.head p{color:#a16b80}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;background:#fff;border:1px solid #f2ccdc;border-radius:18px;padding:6px;position:sticky;top:8px;z-index:5}.tab{border:0;border-radius:13px;padding:12px 8px;background:#fff0f6;color:#92566e;font-weight:900;cursor:pointer}.tab.active{background:#e889ad;color:#fff}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:16px}.card{background:#fff;border:1px solid #f2ccdc;border-radius:18px;padding:14px;box-shadow:0 8px 24px rgba(190,105,145,.08)}.pic{height:190px;border-radius:14px;background:#fff8fb;border:1px dashed #efc8d7;display:flex;align-items:center;justify-content:center;overflow:hidden;color:#b18496}.pic img{width:100%;height:100%;object-fit:contain}.name{font-weight:900;font-size:18px;color:#8f4f68;margin-top:12px}.desc{font-size:13px;color:#a16b80;min-height:40px;margin:5px 0 10px;white-space:pre-line}.bottom{display:flex;justify-content:space-between;align-items:center;gap:10px}.price{font-size:21px;font-weight:900;color:#d96f9a}.status{font-size:11px;font-weight:900;border-radius:999px;padding:7px 10px}.ready{background:#eef9f1;color:#48845a}.paused{background:#fff5e7;color:#a36d24}.out{background:#fff0f3;color:#a65367}.empty{text-align:center;padding:50px 15px;color:#aa7c8e}.back{display:block;text-align:center;margin-top:24px;color:#a55373;font-weight:800;text-decoration:none}@media(max-width:620px){.grid{grid-template-columns:1fr}.tabs{grid-template-columns:1fr 1fr 1fr}.tab{font-size:12px;padding:11px 4px}}</style></head><body><div class="wrap"><div class="head"><h1>♡ สินค้าพร้อมเติม</h1><p>เลือกหมวดหมู่ที่ต้องการได้เลยค่ะ</p></div><div class="tabs"><button class="tab active" data-cat="echoes">เติมกระดุม</button><button class="tab" data-cat="skins">เติมสกิน</button><button class="tab" data-cat="accessories">เติมประดับ</button></div><div id="products" class="grid"><div class="empty">กำลังโหลดสินค้า…</div></div><a class="back" href="./">← กลับหน้าคำนวณ</a></div><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script><script src="firebase-config.js"></script><script>const $=s=>document.querySelector(s),esc=(v='')=>String(v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));let cat='echoes',all=[];const statusText={ready:'พร้อมเติม',paused:'ปิดชั่วคราว',out:'หมดชั่วคราว'};function render(){const list=all.filter(p=>p.visible!==false&&p.category===cat).sort((a,b)=>(a.order||0)-(b.order||0));$('#products').innerHTML=list.length?list.map(p=>`<article class="card"><div class="pic">${p.image?`<img src="${esc(p.image)}" style="object-position:center ${p.imagePosition==='top'?'top':p.imagePosition==='bottom'?'bottom':'center'}" alt="${esc(p.name)}">`:'🖼️ รอใส่รูปสินค้า'}</div><div class="name">${esc(p.name||'สินค้า')}</div><div class="desc">${esc(p.description||'')}</div><div class="bottom"><div class="price">${Number(p.price||0).toLocaleString('th-TH')} ฿</div><span class="status ${esc(p.status||'ready')}">${statusText[p.status]||statusText.ready}</span></div></article>`).join(''):'<div class="empty">ยังไม่มีสินค้าในหมวดนี้ ♡</div>'}document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{cat=b.dataset.cat;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));render()});try{firebase.initializeApp(window.YUIMELLKUB_FIREBASE_CONFIG);firebase.firestore().collection('products').onSnapshot(s=>{all=s.docs.map(d=>({id:d.id,...d.data()}));render()},e=>$('#products').innerHTML='<div class="empty">โหลดสินค้าไม่ได้: '+esc(e.message)+'</div>')}catch(e){$('#products').innerHTML='<div class="empty">เชื่อมระบบสินค้าไม่ได้</div>'}</script></body></html>
