<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Yuimellkub Order Test</title><style>*{box-sizing:border-box}body{font-family:system-ui;background:#fff6fa;color:#70475a;margin:0}.w{max-width:560px;margin:40px auto;padding:18px}.c{background:white;border:1px solid #f1cada;border-radius:20px;padding:20px;box-shadow:0 12px 30px #d879a01a}h1{font-size:23px}label{display:block;font-weight:800;margin:14px 0 6px}input,select{width:100%;padding:12px;border:1px solid #efbfd1;border-radius:12px;font:inherit}button{width:100%;margin-top:18px;padding:13px;border:0;border-radius:13px;background:#e889ad;color:white;font-weight:900;font-size:16px}.s{margin-top:14px;padding:12px;border-radius:12px;background:#fff0f6;font-size:13px;line-height:1.5}</style></head><body><div class="w"><div class="c"><h1>♡ ทดสอบส่งออเดอร์ออนไลน์</h1><div>หน้านี้ใช้ทดสอบ Firestore ก่อนเชื่อมเข้าหน้าร้านหลัก</div><label>UID</label><input id="uid" placeholder="กรอก UID"><label>Server</label><select id="server"><option>Asia</option><option>NA/EU</option></select><label>รายการทดสอบ</label><input id="item" value="ทดสอบออเดอร์ Firebase"><label>ยอด</label><input id="price" value="30 บาท"><button id="send">ส่งออเดอร์ทดสอบ</button><div class="s" id="status">ยังไม่ได้ส่ง</div></div></div><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script><script src="firebase-config.js"></script><script>if(!firebase.apps.length)firebase.initializeApp(window.YUIMELLKUB_FIREBASE_CONFIG);const db=firebase.firestore();const $=id=>document.getElementById(id);$('send').onclick=async()=>{const uid=$('uid').value.trim();if(!uid){$('status').textContent='กรุณากรอก UID';return}const id='TEST-'+Date.now();$('status').textContent='กำลังส่ง…';try{await db.collection('orders').doc(id).set({id,uid,server:$('server').value,item:$('item').value,pack:'ทดสอบ',price:$('price').value,paymentMethod:'ทดสอบ',paymentStatus:'ทดสอบระบบ',shopStatus:'รอเติม',slipAttached:false,createdAt:firebase.firestore.FieldValue.serverTimestamp()});$('status').textContent='✓ ส่งสำเร็จ '+id+' — เปิดหลังบ้านเพื่อตรวจสอบได้เลย';}catch(e){$('status').textContent='ส่งไม่สำเร็จ: '+e.message}}</script></body></html>
